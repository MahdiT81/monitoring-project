server:
  http_listen_port: 9080

positions:
  filename: /positions/positions.yaml   # remembers what was already shipped

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Discovers all running Docker containers via the Docker API,
  # tails their stdout/stderr and pushes to Loki with a `container` label.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream

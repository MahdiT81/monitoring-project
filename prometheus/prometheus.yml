global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Send fired alerts to Alertmanager for grouping & delivery
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The web application we built
  - job_name: "webapp"
    static_configs:
      - targets: ["webapp:5000"]

  # Host-level metrics (CPU, RAM, disk, network of the Docker host)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # Per-container metrics (CPU, memory, network of each container)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # Synthetic uptime checks (what a real user would experience)
  - job_name: "blackbox"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://webapp:5000/health
          - http://grafana:3000/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115   # actual probe requests go to the exporter

  # Prometheus monitoring itself (self-inspection)
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
